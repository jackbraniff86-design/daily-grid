<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;background:#edf0f2;color:#1b2229;font-family:"DM Mono",monospace;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 84px}
h1{font-weight:500;font-size:92px;line-height:1;letter-spacing:-.06em;margin:0 0 22px;text-transform:lowercase}
h1 i{font-style:normal;color:#2f5d8a}
p{margin:0;font-size:26px;color:#6a7681;letter-spacing:-.01em;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(4,96px);gap:10px}
.t{height:76px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;letter-spacing:-.02em;color:#1b2229;background:#f7f9fa;border:1.5px solid #cfd7dd}
.l1{background:#e9d26a;border-color:#e9d26a}.l2{background:#9fcf8a;border-color:#9fcf8a}.l3{background:#8fb6dc;border-color:#8fb6dc}.l4{background:#c3a0d8;border-color:#c3a0d8}
</style></head><body><div class="wrap">
<div><h1>the daily <i>grid</i></h1><p>Sixteen words, four groups of four.<br>Find the groups. A new grid every day.</p></div>
<div class="grid">
<div class="t l1">JUNE</div><div class="t l1">APRIL</div><div class="t l1">AUGUST</div><div class="t l1">MARCH</div>
<div class="t l2">MARS</div><div class="t l2">TWIX</div><div class="t l2">GALAXY</div><div class="t l2">BOUNTY</div>
<div class="t">VENUS</div><div class="t">MAY</div><div class="t">SATURN</div><div class="t">TAYLOR</div>
<div class="t">DEACON</div><div class="t">URANUS</div><div class="t">MERCURY</div><div class="t">NEPTUNE</div>
</div></div></body></html>
